spring.application.name=SprinkleUp

# ---- MySQL ----
# The database is created automatically on first run.
# Set DB_USERNAME / DB_PASSWORD as environment variables (IntelliJ: Run > Edit Configurations > Environment variables),
# or replace the defaults after the colon.
spring.datasource.url=jdbc:mysql://localhost:3306/sprinkleup_db?createDatabaseIfNotExist=true&serverTimezone=UTC
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:}
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=true
spring.jpa.show-sql=false

# ---- JSP views ----
spring.mvc.view.prefix=/WEB-INF/views/
spring.mvc.view.suffix=.jsp

server.port=8080
server.servlet.session.timeout=60m
# Browsers won't send the login cookie on POSTs from other sites (basic CSRF protection)
server.servlet.session.cookie.same-site=lax

# ---- Starter accounts (created on first run if missing) ----
sprinkleup.admin.email=admin@sprinkleup.lk
sprinkleup.admin.password=${ADMIN_PASSWORD:Admin@123}
sprinkleup.demo.email=nethmi@example.com
sprinkleup.demo.password=${DEMO_PASSWORD:Customer@123}
